<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#34d399" />
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1">AEGIS STERLING DUAL-SURFACE ARCHITECTURE</text>
  <text x="475" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Visual Mission Control UI &amp; Autonomous Agent Swarm</text>

  <!-- User Box -->
  <g transform="translate(375, 95)" filter="url(#glow)">
    <rect width="200" height="55" rx="10" fill="url(#primaryGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="100" y="33" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">👤 Developer (You)</text>
  </g>

  <!-- Client-Side UI Card -->
  <g transform="translate(100, 195)" filter="url(#glow)">
    <rect width="280" height="65" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="140" y="28" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">🖥️ Client-Side React UI</text>
    <text x="140" y="48" text-anchor="middle" fill="#cbd5e1" font-size="12">Visual Mission Control &amp; Telemetry</text>
  </g>

  <!-- Chat / Antigravity Card -->
  <g transform="translate(570, 195)" filter="url(#glow)">
    <rect width="280" height="65" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <text x="140" y="28" text-anchor="middle" fill="#c084fc" font-size="15" font-weight="700">💬 Antigravity / IDE Chat</text>
    <text x="140" y="48" text-anchor="middle" fill="#cbd5e1" font-size="12">Direct Prompts (@aegis) &amp; Execution</text>
  </g>

  <!-- Connector Lines from User -->
  <path d="M 430,150 L 240,195" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <path d="M 520,150 L 710,195" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- Core Boundary -->
  <rect x="60" y="305" width="830" height="230" rx="16" fill="#0b1329" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6" />
  <text x="85" y="335" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1">🛡️ AEGIS STERLING CORE</text>

  <!-- Core Engine -->
  <g transform="translate(325, 335)" filter="url(#glow)">
    <rect width="300" height="60" rx="10" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="1.5" />
    <text x="150" y="28" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">⚙️ Orchestrator Engine</text>
    <text x="150" y="48" text-anchor="middle" fill="#e9d5ff" font-size="12">Ouroboros Loop &amp; Fast-Five Autopilot</text>
  </g>

  <!-- Connectors into Engine -->
  <path d="M 240,260 L 400,335" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="270" y="300" fill="#94a3b8" font-size="11">Inspects &amp; Triggers</text>

  <path d="M 710,260 L 550,335" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="645" y="300" fill="#94a3b8" font-size="11">Directives</text>

  <!-- Telemetry Loop Back to UI -->
  <path d="M 325,370 C 140,380 90,300 130,260" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowDashed)" />
  <text x="110" y="330" fill="#94a3b8" font-size="11">Live Telemetry</text>

  <!-- Sub-squads -->
  <!-- Frontend Squad -->
  <g transform="translate(90, 440)" filter="url(#glow)">
    <rect width="230" height="70" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="115" y="28" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">🌐 Frontend Squad</text>
    <text x="115" y="47" text-anchor="middle" fill="#cbd5e1" font-size="12">Lead: @Una</text>
    <text x="115" y="62" text-anchor="middle" fill="#64748b" font-size="11">React · Tailwind · UI Primitives</text>
  </g>

  <!-- Server Squad -->
  <g transform="translate(360, 440)" filter="url(#glow)">
    <rect width="230" height="70" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <text x="115" y="28" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">⚙️ Server Squad</text>
    <text x="115" y="47" text-anchor="middle" fill="#cbd5e1" font-size="12">Lead: @Mira</text>
    <text x="115" y="62" text-anchor="middle" fill="#64748b" font-size="11">Express · Prisma · UAE Statutory</text>
  </g>

  <!-- Mobile Squad -->
  <g transform="translate(630, 440)" filter="url(#glow)">
    <rect width="230" height="70" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="115" y="28" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">📱 Mobile Squad</text>
    <text x="115" y="47" text-anchor="middle" fill="#cbd5e1" font-size="12">Lead: @Iris</text>
    <text x="115" y="62" text-anchor="middle" fill="#64748b" font-size="11">React Native · iOS · Android</text>
  </g>

  <!-- Arrows from Engine to Squads -->
  <path d="M 400,395 L 205,440" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <path d="M 475,395 L 475,440" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />
  <path d="M 550,395 L 745,440" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowBlue)" />
</svg>
